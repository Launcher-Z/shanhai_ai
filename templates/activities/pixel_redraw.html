{% from 'activities/pixel_editor.html' import pixel_editor %}
<section id="pixel-redraw" class="pixel-paint pixel-redraw" data-student-id="{{ student.id }}" hidden aria-label="观摩作品后重画小熊猫礼帽">
  <nav class="redraw-sections" aria-label="活动部分">
    <button type="button" data-redraw-step="0" aria-pressed="true"><span>01</span>观摩作品</button>
    <button type="button" data-redraw-step="1" aria-pressed="false"><span>02</span>重新绘制</button>
  </nav>
  <button type="button" class="redraw-first-button" data-redraw-first hidden>查看我的第一稿</button>
  <section data-redraw-panel="0" aria-label="同学作品观摩">
    <div class="redraw-gallery-heading">
      <div class="redraw-gallery-controls">
        <div class="redraw-source-tabs" role="group" aria-label="切换观摩作品稿件">
          <button type="button" data-redraw-source="lesson-1-task-2" aria-pressed="true">1.2 第一稿</button>
          <button type="button" data-redraw-source="lesson-1-task-3" aria-pressed="false">1.3 重绘第二稿</button>
        </div>
        <p class="redraw-gallery-tip" data-redraw-tip>看看同学 1.2 第一稿的帽形与配色。</p>
      </div>
      <button type="button" data-redraw-refresh>刷新作品</button>
    </div>
    <p class="redraw-message" data-redraw-status role="status"></p>
    <div class="redraw-gallery"></div>
    <button type="button" class="redraw-start" data-redraw-start>开始我的第二稿</button>
  </section>
  <section data-redraw-panel="1" hidden aria-label="重画我的小熊猫礼帽">
    {{ pixel_editor('repaint', '我的第二稿') }}
  </section>
  <dialog class="redraw-lightbox" aria-labelledby="redraw-image-title">
    <div class="redraw-image-heading"><p id="redraw-image-title"></p><button type="button" data-redraw-close aria-label="关闭作品大图">关闭</button></div>
    <img alt="同学的礼帽作品" data-redraw-image>
    <p data-redraw-image-status role="status"></p>
  </dialog>
</section>
