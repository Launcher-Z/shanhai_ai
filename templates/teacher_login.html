{% extends 'base.html' %}{% block title %}教师登录 · 再绘山海经{% endblock %}{% block content %}
<section class="narrow panel"><p class="eyebrow">教师控制台</p><h1>{{ '设置教师密码' if setup else '欢迎回来' }}</h1><p class="muted">{{ '首次使用，请设置教师管理密码。' if setup else '输入教师密码，管理班级与学生。' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">教师密码</label><input id="password" name="password" type="password" minlength="8" required autocomplete="{{ 'new-password' if setup else 'current-password' }}">{% if setup %}<label for="confirm">再次输入密码</label><input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">{% endif %}<button>{{ '设置并进入' if setup else '进入控制台' }} <span>→</span></button></form></section>{% endblock %}
