<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" preserveAspectRatio="none">
  <defs>
    <!-- 顶部与右侧接入纸页边沿，左侧和下沿自然化开，避免矩形底板。 -->
